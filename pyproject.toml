[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fchecker"
dynamic = ["version"]   # numéro unique : fchecker.__version__ (src/fchecker/__init__.py)
description = "Boîte à outils facturation électronique (Factur-X / CII / UBL)"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "lxml>=5.2",
    "pikepdf>=9.0",
    "pypdf>=5.0",
    "saxonche>=12.5",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "openpyxl>=3.1"]
release = ["pyinstaller>=6.22", "pyinstaller-hooks-contrib>=2026.10"]   # tools/build_release.py

[project.scripts]
fchecker = "fchecker.app:main"

[tool.setuptools.dynamic]
version = { attr = "fchecker.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fchecker" = ["**/*.yaml", "**/*.qss.tmpl", "**/*.svg", "**/*.j2", "**/*.xsd", "**/*.xslt", "**/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
