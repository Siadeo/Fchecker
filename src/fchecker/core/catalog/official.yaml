G1.1:
  id: G1.01
  title: Types de facture autorisés
  explanation: 'Les types de factures autorisés sont: Factures simples : - Facture commerciale (380) - Facture auto-facturée
    (389) - Facture affacturée (393) - Facture auto-facturée affacturée (501) Factures d''acompte : - Facture d''acompte (386)
    - Facture d’acompte auto-facturée (500) Factures rectificatives : - Facture rectificative (384) - Facture rectificative
    auto-facturée (471) - Facture rectificative affacturée (472) - Facture rectificative auto-facturée affacturée (473) Avoirs
    : - Avoir auto-facturé (261) - Avoir (381) - Avoir affacturé (396) - Avoir auto-facturé affacturé (502) - Avoir de facture
    d''acompte (503) Les autres types de factures définis dans la norme (UNTDID 1001) ne doivent pas être utilisés.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.10:
  id: G1.10
  title: Devise
  explanation: La liste des Valeurs autorisées pour la Devise d'une Facture est conforme à celle du référentiel ISO 4217
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.101:
  id: G1.101
  title: Assujetti unique (contrôle)
  explanation: Le SIREN de l’assujetti unique doit exister dans l’annuaire, sinon les données règlementaires seront rejetées
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.102:
  id: G1.102
  title: Identifiant à la TVA du vendeur
  explanation: Si la facture contient dans la ventilation de TVA le code "E" (Exonération) en TT-56, alors l'identifiant à
    la TVA du vendeur (TT-34) ou l'identifiant à la TVA du représentant fiscal du vendeur (TT-122) est obligatoire. Les entreprises
    en franchise en base ne disposant pas systématiquement d'un numéro de TVA pourront utiliser un code Z en TT-56.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.104:
  id: G1.104
  title: Identifiant de la transmission
  explanation: 'L’identifiant de la transmission est composé de caractères alphanumériques. Seuls les caractères spéciaux
    suivants sont autorisés : espace (" ") tiret ("-") signe "+" tiret bas (underscore : "_") barre oblique (slash : "/")
    L’identifiant ne doit pas comporter uniquement des espaces. L’identifiant ne peut pas débuter ou terminer par un espace
    et ne peut en outre comporter d’espaces consécutifs.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.112:
  id: G1.112
  title: Matricule plateforme
  explanation: 'le matricule de la plateforme positionné sur la ligne d''annuaire ne doit pas appartenir à la liste : - 9997
    (matricule CPRO émission) - 9999 (matricule CPRO réception) - 9998 (matricule PPF)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.113:
  id: G1.113
  title: Date de fin d'effet
  explanation: La date de fin d’effet d'un bloc d'informations ne peut pas être antérieure ou égale à la date de début d'effet
    de ce bloc d'information
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.114:
  id: G1.114
  title: Génération d'un cycle de vie à partir de données non exploitables.
  explanation: 'Si un contrôle fonctionnel du PPF identifie une anomalie bloquante sur au moins une des valeurs qui permettent
    d''alimenter les balises MDT-87, MDT-100 et MDT-129 (avec en valeur de qualifiant MDT-130 "0002"), le PPF alimentera ces
    balises avec les valeurs par défaut suivantes : MDT-87 : XXXXXXXXXXXXXXXXXXXX (20 caractères ''X'') MDT-100 : 19000101000000
    MDT-129 : 000000000 (9 caractères ''0'') avec en valeur de qualifiant MDT-130 "0002" pour un SIREN par défaut Le PPF renseignera
    dans la balise MDT-126 un message d''erreur indiquant qu''au moins une de ces valeurs ne respecte pas les contrôles fonctionnels
    et entre guillemets les valeurs qui ont été renseignées dans l''objet métier référencé et qui auraient dû alimenter les
    balises MDT-87, MDT-100 et MDT-129.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.115:
  id: G1.115
  title: Caractères autorisés dans un suffixe
  explanation: 'Les caractères autorisés sont : - Les chiffres - Les lettres (alphabet latin) sans accent, minuscules et majuscules
    - Les caractères spéciaux "-", "_","."'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.12:
  id: G1.12
  title: Gestion devise hors EUR
  explanation: Si BT-5 (Code de devise de la facture) est différent de l'Euro, alors la balise BT-111 (Montant total de TVA
    de la facture exprimée (devise de comptabilisation)) devient obligatoire et doit être exprimée en EURO
  bt:
  - BT-5
  - BT-111
  source: DGFiP annexe 7 v1.9 (3.2)
G1.14:
  id: G1.14
  title: Format de montant
  explanation: Le montant dans une facture est exprimé par un nombre sur 19 positions, et ne peut comporter plus de 2 décimales.
    Le séparateur entre le nombre entier et les décimales est un point (« . »). Le signe « - » devant le montant compte comme
    un caractère. Si le nombre total de chiffres du nombre (partie entière et partie décimale comprises) dépasse 19 caractères,
    le montant sera rejeté. Le séparateur (« . ») n'est pas comptabilisé dans les 19 caractères.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.15:
  id: G1.15
  title: Format de quantité
  explanation: La quantité dans une facture est exprimé par un nombre sur 19 positions, et ne peut comporter plus de 4 décimales.
    Le séparateur entre le nombre entier et les décimales est un point (« . »). Le signe négatif (« - ») devant la quantité
    compte comme un caractère. Si le nombre total de chiffres du nombre (partie entière et partie décimale comprises) dépasse
    19 caractères, la quantité sera rejetée. Le séparateur (« . ») n'est pas comptabilisé dans les 19 caractères.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.16:
  id: G1.16
  title: Format de prix
  explanation: Le prix montant dans une facture est exprimé par un nombre sur 19 positions, et ne peut comporter plus de 6
    décimales. Le séparateur entre le nombre entier et les décimales est un point (« . »). Aucun signe négatif devant le montant
    (« - ») n’est autorisé. Si le nombre total de chiffres du nombre (partie entière et partie décimale comprises) dépasse
    19 caractères, le prix montant sera rejeté. Le séparateur (".") n'est pas comptabilisé dans les 19 caractères.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.18:
  id: G1.18
  title: Date de versement de l'acompte
  explanation: 'Si le type de facture est: - Facture d''acompte (386) - Facture d’acompte auto-facturé (500) (*), la date
    de versement de l’acompte doit être obligatoirement complétée si la date de versement de l''acompte est déterminée / connue
    et qu''elle est différente de la date d''émission. Règle de gestion métier mais ne peut pas être contrôlée d’un point
    de vue applicatif'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.2:
  id: G1.02
  title: Cadre de Facturation
  explanation: 'Les valeurs autorisées pour le Cadre (Mode de Facturation) sont: B1 : Dépôt d''une facture de bien S1 : Dépôt
    d''une facture de prestation de service M1 : Dépôt d''une facture double (livraison de bien et services qui ne sont pas
    accessoires l''une de l''autre) B2 : Dépôt d''une facture de bien déjà payée S2 : Dépôt d''une facture de prestation de
    service déjà payée M2 : Dépôt d''une facture double déjà payée B4 : Dépôt d''une facture définitive (après acompte) de
    bien S4 : Dépôt d''une facture définitive (après acompte) de service M4 : Dépôt d''une facture définitive (après acompte)
    double S5 : Dépôt par un sous-traitant d’une facture de prestation de service S6 : Dépôt par un cotraitant d’une facture
    de prestation de service B7 : Dépôt d''une facture de bien ayant fait l''objet d''un e-reporting (TVA déjà collectée)
    S7 : Dépôt d''une facture de prestation de service ayant fait l''objet d''un e-reporting (TVA déjà collectée)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.24:
  id: G1.24
  title: Taux de TVA autorisé
  explanation: 'Le taux de la TVA applicable est conforme à la liste suivante : Taux 0 10 13 20 8.5 19.6 2.1 5.5 7 20.6 1.05
    0.9 1.75 9.2 9.6 Le taux est exprimé en pourcentage et non en coefficient (exemple : 20). Le symbole « % » n’est pas à
    indiquer. Le séparateur (« . ») n''est pas comptabilisé dans les 5 caractères. Le contrôle s’effectuera sur la valeur,
    sans tenir compte de la forme (par exemple : 20 ou 20.0 ou 20.00 seront considérés comme équivalents).'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.31:
  id: G1.31
  title: Référence facture antérieure en cas d'avoir ou facture rectificative
  explanation: En trajectoire de démarrage (profil BASE) le fichier de données réglementaires (F1) d’un avoir comporte obligatoirement
    les numéros de facture antérieure (BT-25) en entête de document et un unique numéro de facture antérieure dans le F1 d’une
    facture rectificative. En trajectoire cible (profil FULL) la date (BT-26) liée à la facture antérieure devient aussi obligatoire.
    Il est attendu obligatoirement autant de dates qu’il existe de numéros de facture antérieure. il est possible de ne pas
    renseigner numéro de facture antérieure (BT-25) et date de facture antérieure (BT-26) en entête de document à la condition
    de les renseigner exclusivement sur chacune des lignes articles. Seuls les numéros (balise EXT-FR-FE-136) et dates (balise
    EXT-FR-FE-138) de facture antérieures sur chaque ligne article doivent obligatoirement être renseignées. Si ces informations
    (numéro/date de facture antérieure) sont renseignées à la fois en entête et sur les lignes de facture, le F1 d'avoir ou
    de facture rectificative sera rejetté.
  bt:
  - BT-25
  - BT-26
  source: DGFiP annexe 7 v1.9 (3.2)
G1.32:
  id: G1.32
  title: Référence facture antérieure en cas d'avoir ou facture rectificative
  explanation: 'Si la facture est de type "Facture rectificative" : Alors une et une seule Référence à une facture antérieure
    (TT-30) doit être présente, ainsi que sa Date (TT-31) Si la facture est de type "Avoir" : Alors au moins une Référence
    à une facture antérieure ainsi que sa Date doivent être présentes soit en entête (TT-30 et TT-31), soit dans chaque ligne
    de facture (TT-300 et TT-301).'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.36:
  id: G1.36
  title: Date
  explanation: Dans une date, l'année ne pourra pas être < 2000 et > 2099
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.38:
  id: G1.38
  title: Date effective de livraison / fin d'exécution de la prestation
  explanation: 'Donnée à fournir dans la mesure où elle est déterminée et différente de la date d''émission (art. 242 nonies
    A 10°). Dans une facture, peut être renseignée : - la date de livraison ou la date de fin d''exécution de la prestation
    (TT-41) ou - une période de facturation en cas de facture périodique ou récapitulative (article 289 - I.3 du CGI) (TG-25)
    Règle de gestion métier mais ne peut pas être contrôlée d’un point de vue applicatif'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.39:
  id: G1.39
  title: Date effective de livraison / fin d'exécution de la prestation
  explanation: 'Donnée à fournir dans la mesure où elle est déterminée et différente de la date d''émission (art. 242 nonies
    A 10°). Dans une facture, peut être renseignée : - la date de livraison ou la date de fin d''exécution de la prestation
    (BT-72) ou - la date de livraison à la ligne, en cas de multi-livraisons (EXT-FR-FE-BG-11) ou - une période de facturation
    en cas de facture périodique ou récapitulative (article 289 - I.3 du CGI) (BG-26) Règle de gestion métier mais ne peut
    pas être contrôlée d’un point de vue applicatif'
  bt:
  - BT-72
  - BG-11
  - BG-26
  source: DGFiP annexe 7 v1.9 (3.2)
G1.40:
  id: G1.40
  title: Motif d'exonération de TVA
  explanation: Une ventilation de la TVA (TG-23) avec le code de type de TVA (TT-56) « Exonération de TVA » (valeur "E") doit
    comprendre un code de motif d'exonération de la TVA (TT-59) et un motif d'exonération de la TVA (TT-58).
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.41:
  id: G1.41
  title: Motif d'exonération de TVA
  explanation: Une ventilation de la TVA (BG-23) avec le code de type de TVA (BT-118) « Exonération de TVA » (valeur "E")
    doit comprendre un code de motif d'exonération de la TVA (BT-121) et un motif d'exonération de la TVA (BT-120). Cette
    règle ne s'applique pas en cas d'une facture rectificative ou d'une facture de moins de 150 € uniquement. En effet, dans
    ce cas précis, le code de motif d'exonération de la TVA (BT-121) et le motif d'exonération de la TVA (BT-120) peuvent
    être non renseignés.
  bt:
  - BG-23
  - BT-118
  - BT-121
  - BT-120
  source: DGFiP annexe 7 v1.9 (3.2)
G1.42:
  id: G1.42
  title: Unicité de la facture
  explanation: 'Dans le cas d''une transmission déclarée par le vendeur, l''identifiant de facture, composé des éléments suivants:
    - Numéro de facture ( 35 caractères maximum) - (TT-19) - Année de production de la facture (Issue de la date d''émission
    de la facture) - ( TT-20) - Identifiant du fournisseur : numéro SIREN (TT-33). doit être unique. L’unicité de la facture
    vise à éviter les erreurs de facturation (double facturation notamment). Une facture présentant un même identifiant de
    facture ( informations similaires cumulativement sur ces trois données) par rapport à une facture précédemment envoyée
    fera l’objet d’un rejet par les plateformes. Le contrôle d’unicité est systématiquement bloquant. En cas de mandat de
    facturation, le numéro de facture doit comporter une racine propre au mandataire pour éviter les doublons de facture avec
    celles de son mandant. Le numéro de facture doit respecter la règlementation du BOFIP suivante: BOI-TVA-DECLA-30-20-20-10
    du 18/10/2023 Section : A. La numérotation des factures'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.43:
  id: G1.43
  title: Option de paiement de TVA
  explanation: 'L''option de TVA sur les débits est générale et l''emporte sur l''ensemble des factures émises. En cas de
    prestations de services et d''option pour la TVA sur les débits, l''exigibilité de la TVA est due au moment de l''inscription
    de la somme correspondante au débit du compte « client ». En pratique, le débit coïncide le plus souvent avec la facturation.
    Il est souligné que l''option d''acquitter la taxe d''après les débits ne peut avoir pour effet de retarder l''exigibilité
    de la taxe. L''option pour la TVA sur les débits est indiquée au travers du BT-8. Le BT-8 ne sera obligatoire que si l''entreprise
    a opté pour la TVA sur les débits et le spécifie au moyen du code 5 (CII) ou 3 (UBL). N.B. : Règle de gestion métier mais
    ne peut pas être contrôlée d''un point de vue applicatif'
  bt:
  - BT-8
  source: DGFiP annexe 7 v1.9 (3.2)
G1.44:
  id: G1.44
  title: Option de paiement de TVA
  explanation: 'L''option de TVA sur les débits est générale et l''emporte sur l''ensemble des factures émises. En cas de
    prestations de services et d''option pour la TVA sur les débits, l''exigibilité de la TVA est due au moment de l''inscription
    de la somme correspondante au débit du compte « client ». En pratique, le débit coïncide le plus souvent avec la facturation.
    Il est souligné que l''option d''acquitter la taxe d''après les débits ne peut avoir pour effet de retarder l''exigibilité
    de la taxe. L''option pour la TVA sur les débits est indiquée au travers du TT-24. Le TT-24 ne sera obligatoire que si
    l''entreprise a opté pour la TVA sur les débits et le spécifie au moyen du code 5 (CII) ou 3 (UBL) N.B. : Règle de gestion
    métier mais ne peut pas être contrôlée d''un point de vue applicatif'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.45:
  id: G1.45
  title: Unicité de la facture
  explanation: 'L''identifiant de facture, composé des éléments suivants: - Numéro de facture ( 35 caractères maximum) - (BT-1
    de la norme EN16931) - Année de production de la facture (Issue de la date d''émission de la facture) - (BT-2 de la norme
    EN16931) - Identifiant du fournisseur : numéro SIREN (BT-30 de la norme EN16931). doit être unique. L’unicité de la facture
    vise à éviter les erreurs de facturation (double facturation notamment). Une facture présentant un même identifiant de
    facture (informations similaires cumulativement sur ces trois données) par rapport à une facture précédemment envoyée
    fera l’objet d’un rejet par les plateformes. Le contrôle d’unicité est systématiquement bloquant (rejet des données de
    facturation (F1) correspondantes). Les données de facturation (F1) ayant fait l''objet d''un rejet du PPF (hors doublon)
    sont exclues de ce contrôle. En cas de mandat de facturation, le numéro de facture doit comporter une racine propre au
    mandataire pour éviter les doublons de facture avec celles de son mandant. Le numéro de facture doit respecter la règlementation
    du BOFIP suivante: BOI-TVA-DECLA-30-20-20-10 du 18/10/2023 Section : A. La numérotation des factures'
  bt:
  - BT-1
  - BT-2
  - BT-30
  source: DGFiP annexe 7 v1.9 (3.2)
G1.47:
  id: G1.47
  title: Identifiant à la TVA du vendeur
  explanation: Si la facture contient dans la ventilation de TVA le code "E" (Exonération) en BT-118, alors l'identifiant
    à la TVA du vendeur (BT-31) est obligatoire. Les entreprises en franchise en base ne disposant pas systématiquement d'un
    numéro de TVA pourront utiliser un code "Z" en BT-118.
  bt:
  - BT-118
  - BT-31
  source: DGFiP annexe 7 v1.9 (3.2)
G1.5:
  id: G1.05
  title: Identifiant de la facture / identifiant de la facture d’origine
  explanation: 'L’identifiant de la facture est limité à 35 caractères alphanumériques. Les caractères spéciaux suivants sont
    autorisés : - espace (" ") - tiret ("-") - signe "+" - tiret bas (underscore : "_") - barre oblique (slash : "/") L’identifiant
    ne doit pas comporter uniquement des espaces. L’identifiant ne peut pas débuter ou terminer par un espace et ne peut en
    outre comporter d’espaces consécutifs.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.52:
  id: G1.52
  title: Code du sujet de la note de facture
  explanation: 'Valeur à choisir dans le référentiel de la norme UNTDID 4451, en particulier : AAB [Mention de l''escompte.
    Correspond aux conditions de paiement. Il s''agit d''une mention manuscrite indiquant au client qu''il peut appliquer
    un escompte s''il paie avant la date d''échéance du paiement. Cela ne correspond pas au montant de l''escompte.] TXD [Concerne
    les opérations externes à l’assujetti unique, c’est-à-dire les opérations entre un membre d’un assujetti unique et un
    tiers à cet assujetti unique.] La note de facture (BT-22 ou TT-27) doit être obligatoirement: "Membre d''un assujetti
    unique" BLU [Peut servir aussi à d''autres taxes dont l''écotaxe.] La note de facture (BT-22/BT-127 ou TT-27/TT-61-1)
    doit contenir "Eco-participation (L. 541-10 du code de l''environnement)" ou "Eco-contribution DEEE" pour l''écotaxe.
    N.B. : Règle de gestion métier mais ne peut pas être contrôlée d''un point de vue applicatif'
  bt:
  - BT-22
  - BT-127
  source: DGFiP annexe 7 v1.9 (3.2)
G1.53:
  id: G1.53
  title: Cohérence montants de TVA
  explanation: Le montant total hors TVA des factures (TT-51) ou des transactions (TT-82) doit être égal à la somme des montants
    de base d'imposition du type de TVA (TT-54 / TT-87). Une tolérance de 1 centime sera possible pour éviter les problèmes
    d'arrondi. Le montant total de TVA des factures (TT-52) ou des transactions (TT-83) doit être égal à la somme des totaux
    de TVA par taux (TT-55 / TT-88)*. Une tolérance de 1 centime sera possible pour éviter les problèmes d'arrondi. *Applicable
    uniquement si la devise de la facture (TT-22) ou des transactions (TT-78) est l’EURO.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.55:
  id: G1.55
  title: Cohérence du prix de l'article
  explanation: Si le prix brut de l’article (BT-148 ou TT-71) et le rabais sur le prix de l'article (BT-147 ou TT-70) sont
    renseignés alors le prix net de l'article (BT-146 pour le flux 1, TT-69 pour le flux 10) doit être égal au prix brut de
    l'article (BT-148 ou TT-71) - le rabais sur le prix de l'article (BT-147 ou TT-70) Une tolérance de 1 centime sera possible
    pour éviter les problèmes d'arrondi
  bt:
  - BT-148
  - BT-147
  - BT-146
  source: DGFiP annexe 7 v1.9 (3.2)
G1.57:
  id: G1.57
  title: Régime de la marge
  explanation: 'Si la catégorie de transaction indiquée est TMA1 (Opérations soumises à un régime […] de TVA sur la marge
    […]), le montant HT (TT-82) est le montant total de la marge ramenée HT, et la base d''imposition (TT-87) indiquée est
    le montant de la marge ramenée HT correspondant au taux de TVA (TT-86). N.B. : Règle de gestion métier mais ne peut pas
    être contrôlée d''un point de vue applicatif'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.60:
  id: G1.60
  title: Cadre de facturation (contrôle)
  explanation: 'Si le cadre de facturation est : B4 : Factures définitives (après acompte) de bien S4 : Factures définitives
    (après acompte) de prestation de service M4 : Factures définitives (après acompte) double alors le type de facture ne
    peut pas être : - Facture d''acompte (386) - Facture d’acompte auto-facturée (500) - Avoir de facture d''acompte (503)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.63:
  id: G1.63
  title: Code SIREN AcheteurVendeur
  explanation: Le SIREN du vendeur (BT-30) et de l'acheteur (BT-47) sont obligatoires et doivent exister dans l’annuaire.
    L'identifiant de schéma associés à ces SIREN sont également obligatoires (les données règlementaires seront rejetées en
    cas d'absence).
  bt:
  - BT-30
  - BT-47
  source: DGFiP annexe 7 v1.9 (3.2)
G1.65:
  id: G1.65
  title: Code SIREN
  explanation: 'Transaction B2B international : Si le vendeur est assujetti à la TVA en France, l''indication de son SIREN
    est obligatoire et doit être connu de la base INSEE. Règle de gestion métier mais ne peut pas être contrôlée d’un point
    de vue applicatif.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.66:
  id: G1.66
  title: Code SIREN
  explanation: 'Transaction B2B international : Si l''acheteur est assujetti à la TVA en France, l''indication de son SIREN
    est obligatoire et doit être connu de la base INSEE. Règle de gestion métier mais ne peut pas être contrôlée d’un point
    de vue applicatif.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.67:
  id: G1.67
  title: Option de paiement de TVA
  explanation: 'Obligatoire, pour les prestations de service et les factures doubles (selon codification TT-81 - catégorie
    de transactions) si l''opérateur a opté pour le paiement de la TVA sur les débits. N.B. : Règle de gestion métier mais
    ne peut pas être contrôlée d''un point de vue applicatif'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.68:
  id: G1.68
  title: Catégorie de transactions
  explanation: 'La catégorie de transaction doit être codifiée selon la liste suivante : TLB1 : Livraisons de biens soumises
    à la taxe sur la valeur ajoutée ; TPS1 : Prestations de services soumises à la taxe sur la valeur ajoutée ; TNT1 : Livraisons
    de biens et prestations de services non soumises à la taxe sur la valeur ajoutée en France dont les ventes à distance
    intracommunautaires mentionnées au 1° du I de l’article 258 A et à l’article 259 B du code général des impôts ; TMA1 :
    Opérations donnant lieu à l''application des régimes prévus au e) du 1 de l''article 266 et aux articles 268 et 297 A
    du CGI (régime de TVA sur la marge).'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.7:
  id: G1.07
  title: Date de la facture, de transaction ou de paiement
  explanation: La date de la facture, de transaction ou de paiement doit être antérieure ou égale à la date de contrôle dans
    le système.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.73:
  id: G1.73
  title: Identifiant d’entreprise
  explanation: 'Les codes suivants sont autorisés (ils sont issus du référentiel ICD 6523) : - 0002 : SIREN avec 9 caractères
    - 0009 : SIRET avec 14 caractères - 0223 : UE_HORS_FRANCE avec 18 caractères - 0227 : HORS_UE (dont Wallis et Futuna)
    avec 18 caractères - 0224 : code routage avec 100 caractères - 0228 : RIDET avec 9 ou 10 caractères - 0229 : TAHITI avec
    9 caractères - 0226 : PARTICULIER avec 80 caractères - 0238 : Matricule plateforme agréée ou PPF avec 4 caractères'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.76:
  id: G1.76
  title: Assujetti unique (en émission de facture)
  explanation: 'En cas d''assujetti unique, les données relatives au membre de l''assujetti unique doivent figurer dans le
    bloc VENDEUR (BG-4). En sus, Il faut systématiquement renseigner les informations suivantes, les trois champs étant obligatoire
    : - La mention "Membre d''un assujetti unique" avec le code "TXD" dans la note de facture (cf. G1.52 ). - Les données
    relatives à l''assujetti unique, autres que le SIREN, doivent figurer dans le bloc REPRESENTANT FISCAL DU VENDEUR (BG-11).
    - Le champ BT-29d devra servir à renseigner le SIREN de l''assujetti unique'
  bt:
  - BG-4
  - BG-11
  source: DGFiP annexe 7 v1.9 (3.2)
G1.79:
  id: G1.79
  title: SIREN de l'Assujetti unique acheteur (en réception de facture)
  explanation: 'En cas d''assujetti unique, le SIREN de l''acheteur à renseigner est celui du membre de l''assujetti unique.
    N.B. : Règle de gestion métier mais ne peut pas être contrôlée d’un point de vue applicatif'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.80:
  id: G1.80
  title: Correspondance SIREN / SIRET
  explanation: La racine du SIRET (9 premiers chiffres), quand il est renseigné sur un bloc en particulier, doit être identique
    au SIREN renseigné sur ce même bloc
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.83:
  id: G1.83
  title: Type de l'identifiant de routage
  explanation: Un identifiant de routage doit être obligatoirement qualifié par le qualifiant 0224.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.84:
  id: G1.84
  title: Création d'une ligne d'annuaire de masquage
  explanation: 'Une ligne d''annuaire ayant pour nature (DT-7-2) "M" doit masquer une ligne d''annuaire ayant pour nature
    (DT-7-2) "D" existante. Une ligne d''annuaire de nature "M" doit donc porter les mêmes informations que cette dernière
    : - Date de prise d''effet du bloc d''informations (DT-7-3-1) - Date de fin d''effet du bloc d''informations si existant
    (DT-7-3-2) - Type d''acteur (DT-7-4) - Identifiant de ligne d''adressage (DT-7-5-1) - Numéro SIREN du destinataire (DT-7-5-1-1)
    - Numéro SIRET du destinataire si existant (DT-7-5-1-2) - Identifiant de routage du destinataire si existant (DT-7-5-1-3)
    - Suffixe si existant (DT-7-5-1-4) - Matricule plateforme de réception (DT-7-6)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.85:
  id: G1.85
  title: Date de prise d'effet d'une ligne de masquage
  explanation: Une ligne d'annuaire dont la nature (DT-7-2) est "M" doit avoir une date de prise d'effet (DT-7-3-1) postérieure
    à la date du jour, autrement dit égale au moins à J+1
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.86:
  id: G1.86
  title: Non recouvrement des périodes de validité des lignes d'annuaire "D"
  explanation: Deux lignes d'annuaire dont la nature (DT-7-2) est "D" et qui sont relatives à la même maille d'adressage ne
    peuvent avoir de périodes de validité qui se recouvrent même partiellement
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.87:
  id: G1.87
  title: Restrictions sur la date de prise d'effet
  explanation: 'Une ligne d''annuaire dont la nature (DT-7-2) est "D" relative à une maille d''adressage doit avoir une date
    de prise d''effet (DT-7-3-1) postérieure à la date du jour, autrement dit égale au moins à J+1, ou satisfaire aux conditions
    suivantes : - être porteuse des mêmes informations qu''une ligne d''annuaire de nature "D", existante, en vigueur et relative
    à la même maille d''adressage : - Date de prise d''effet du bloc d''informations (DT-7-3-1) - Type d''acteur (DT-7-4)
    - Identifiant de ligne d''adressage (DT-7-5-1) - Numéro SIREN du destinataire (DT-7-5-1-1) - Numéro SIRET du destinataire
    si existant (DT-7-5-1-2) - Identifiant de routage du destinataire si existant (DT-7-5-1-3) - Suffixe si existant (DT-7-5-1-4)
    - Matricule plateforme de réception (DT-7-6) Dans ce cas précis la ligne créée n''aura pour effet que de définir ou modifier
    la date de fin d''effet de la maille d''adressage concernée.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.88:
  id: G1.88
  title: Restrictions sur la date de fin
  explanation: La ligne d'annuaire doit avoir une date de fin d'effet (DT-7-3-2) postérieure à la date du jour, autrement
    dit égale au moins à J+1
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.89:
  id: G1.89
  title: Format du SIREN
  explanation: Le SIREN se compose de 9 chiffres
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.9:
  id: G1.09
  title: Date
  explanation: 'Tous les champs Date sont sous le format suivant : AAAA-MM-JJ en UBL AAAAMMJJ en CII Dans le cadre du e-reporting
    (flux 10) et de l''annuaire, le format des champs dates est obligatoirement : AAAAMMJJ. Conversion UBL vers CII. En flux
    10 spécifiquement (direct ou converti), le format est une date sans tiret.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.91:
  id: G1.91
  title: Prérequis au code routage
  explanation: Un SIRET est obligatoire lorsqu'un identifiant de routage est indiqué
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.92:
  id: G1.92
  title: Cohérence SIRET - Identifiant de routage
  explanation: L'identifiant de routage indiqué doit exister et être en vigueur pour son SIRET de rattachement
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.93:
  id: G1.93
  title: Maille d'adressage suffixe
  explanation: Un suffixe ne peut être indiqué lorsque le champ SIRET est renseigné. Le suffixe ne peut être apposé que s'il
    est associé à un champ SIREN renseigné
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.94:
  id: G1.94
  title: Matricule Plateforme
  explanation: Le matricule doit être porté par une plateforme dont l'immatriculation est en vigueur. Seul exception, une
    PA peut clôturer une ligne d’annuaire associée à une plateforme dont l’immatriculation n’est plus en vigueur, si la date
    d’effet de la ligne de clôture est antérieure à la date courante.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.95:
  id: G1.95
  title: Caractères autorisés dans un identifiant de code routage
  explanation: 'Les caractères autorisés sont : - Les chiffres - Les lettres (alphabet latin) sans accent, minuscules et majuscules
    - Les caractères spéciaux "-", "_"'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.96:
  id: G1.96
  title: Numéro de SIREN - Annuaire
  explanation: Le SIREN doit être référencé dans l'annuaire et actif, sinon le code routage/ligne d'annuaire ne sera pas actualisé.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G1.97:
  id: G1.97
  title: Gestion du SIRET - Annuaire
  explanation: Si la donnée renseignée est un SIRET, il doit être référencé dans l'annuaire et actif, sinon le code routage/ligne
    d'annuaire ne sera pas actualisé.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G2.1:
  id: G2.01
  title: Code Pays
  explanation: Le code Pays doit exister dans le Code ISO 3166 (norme alpha-2 uniquement).
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G2.19:
  id: G2.19
  title: Identifiant du Vendeur et de l'Acheteur
  explanation: 'L''identifiant du Vendeur (TT-33-1) renseigné est défini par le qualifiant (issu du référentiel ICD 6523)
    : - "0002" --> SIREN sur 9 caractères numériques - "0223" --> UE_HORS_FRANCE (correspond à l''identifiant de TVA intracommunautaire)
    sur 18 caractères maximum - "0227" --> HORS_UE (dont Wallis et Futuna) (correspond au code Pays et les 16 premiers caractères
    de la raison sociale) sur 18 caractères maximum - "0228" --> RIDET sur 9 ou 10 caractères - "0229" --> TAHITI sur 9 caractères
    L''identifiant de l''Acheteur (TT-37) renseigné est défini par le qualifiant (issu du référentiel ICD 6523) : - "0002"
    --> SIREN sur 9 caractères numériques - "0223" --> UE_HORS_FRANCE (correspond à l''identifiant de TVA intracommunautaire)
    sur 18 caractères maximum - "0227" --> HORS_UE (dont Wallis et Futuna) (correspond au code Pays et les 16 premiers caractères
    de la raison sociale) sur 18 caractères maximum - "0228" --> RIDET sur 9 ou 10 caractères - "0229" --> TAHITI sur 9 caractères'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G2.31:
  id: G2.31
  title: Code de catégorie de TVA
  explanation: 'Seuls les codes de catégorie de TVA suivants seront acceptés: S = Taux de TVA standard E = Exonéré de TVA
    AE = Autoliquidation de TVA K = Exonération pour cause de livraison intracommunautaire G = Exonération de TVA pour Export
    hors UE O = Hors du périmètre d''application de la TVA Z = Taux de TVA égal à 0 (cf. G1.47) Les codes de catégorie de
    TVA suivants ne sont pas pertinents en France : L = Iles Canaries M = Ceuta et Mellila'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G2.32:
  id: G2.32
  title: Règle de TVA hors champs
  explanation: 'Les données de facturation (F1) seront rejetées si la facture comporte uniquement des codes de type TVA à
    « O » (Hors champs de la TVA) (BT-118) et/ou uniquement des codes de type TVA à « E » (Exonéré) (BT-118), associés à des
    code d’exonération (BT-121) correspondant à l’un des codes ci-dessous : • VATEX-FR-CGI261-1 • VATEX-FR-CGI261-2 • VATEX-FR-CGI261-3
    • VATEX-FR-CGI261-4 • VATEX-FR-CGI261-5 • VATEX-FR-CGI261-7 • VATEX-FR-CGI261-8 • VATEX-FR-CGI261A • VATEX-FR-CGI261B
    • VATEX-FR-CGI261C-1 • VATEX-FR-CGI261C-2 • VATEX-FR-CGI261C-3 • VATEX-FR-CGI261D-1 • VATEX-FR-CGI261D-1BIS • VATEX-FR-CGI261D-2
    • VATEX-FR-CGI261D-3 • VATEX-FR-CGI261D-4 • VATEX-FR-CGI261E-1 • VATEX-FR-CGI261E-2 Cette règle n''est applicable que
    pour toutes les données de facturation (F1) issues de factures B2B, B2G et G2B. Si l''acheteur de la facture dont sont
    issues les données de facturation est une entité publique (B2G), cette règle ne s''applique pas.'
  bt:
  - BT-118
  - BT-121
  source: DGFiP annexe 7 v1.9 (3.2)
G2.33:
  id: G2.33
  title: Identifiant à la TVA du Vendeur et de l'Acheteur
  explanation: Si l'identifiant du schéma de l'identifiant du Vendeur (TT-33-1) est égal à 0002 ou 0223 alors l'identifiant
    à la TVA du Vendeur (TT-34) doit être systématiquement complété et qualifié en TT-34-0 par la valeur "VAT" Si l'identifiant
    du schéma de l'identifiant de l'Acheteur (TT-37) est égal à 0002 ou 0223 alors l'identifiant à la TVA de l'Acheteur (TT-38)/
    doit être systématiquement complété et qualifié en TT-38-0 par la valeur "VAT"
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G2.7:
  id: G2.07
  title: Format Identifiant d’un tiers
  explanation: Si l'identification du schéma est 0009 (SIRET), alors l'identifiant doit être sur 14 chiffres
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.10:
  id: G6.10
  title: Taux de TVA de la remise au niveau du document
  explanation: Si le bloc BG-20 (REMISES AU NIVEAU DU DOCUMENT) est renseigné et le code de type de TVA BT-95 est différent
    de "Non soumis à la TVA", alors le Taux de TVA de la remise au niveau du document (BT-96) est obligatoire.
  bt:
  - BG-20
  - BT-95
  - BT-96
  source: DGFiP annexe 7 v1.9 (3.2)
G6.11:
  id: G6.11
  title: Données obligatoires selon le cas de gestion - Trajectoire "DEMARRAGE"
  explanation: Cette donnée est obligatoire à partir du 01/09/2026 lorsque la donnée doit être mentionnée sur la facture conformément
    à la réglementation (CGI, Ccom,...). Règle de gestion métier mais ne peut pas être contrôlée d’un point de vue applicatif.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.12:
  id: G6.12
  title: Données obligatoires selon le cas de gestion - Trajectoire "CIBLE"
  explanation: Cette donnée est obligatoire à partir du 01/09/2027 lorsque la donnée doit être mentionnée sur la facture conformément
    à la réglementation (CGI, Ccom,...). Règle de gestion métier mais ne peut pas être contrôlée d’un point de vue applicatif.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.13:
  id: G6.13
  title: Représentant fiscal du vendeur
  explanation: Le bloc BG-11 (Représentant fiscal du vendeur) doit être renseigné avec les données relatives à l'assujetti
    unique, si applicable (voir G1.76) Règle de gestion métier mais ne peut pas être contrôlée d’un point de vue applicatif.
  bt:
  - BG-11
  source: DGFiP annexe 7 v1.9 (3.2)
G6.14:
  id: G6.14
  title: Données obligatoires - Trajectoire "DEMARRAGE"
  explanation: 'Transaction B2B international : Cette donnée est obligatoire à partir du 01/09/2026 lorsque la donnée doit
    être mentionnée sur la facture conformément à la réglementation (CGI, Ccom,...). Règle de gestion métier mais ne peut
    pas être contrôlée d’un point de vue applicatif.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.15:
  id: G6.15
  title: Données obligatoires - Trajectoire "CIBLE"
  explanation: 'Transaction B2B international : Cette donnée est obligatoire à partir du 01/09/2027 lorsque la donnée doit
    être mentionnée sur la facture conformément à la réglementation (CGI, Ccom,...). Règle de gestion métier mais ne peut
    pas être contrôlée d’un point de vue applicatif.'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.16:
  id: G6.16
  title: Données obligatoires - Trajectoire "CIBLE" - Adresse de livraison
  explanation: 'Certaines données liées à l''adresse de livraison BG-15 sont obligatoires si l’adresse est différente de l''adresse
    de facturation (Acheteur - Bloc BG-8) et seulement à partir du 01/09/2027. Les données obligatoires sont les suivantes
    : • Adresse de livraison - Ligne 1 (BT-75) • Localité Adresse de livraison (BT-77) • Code postal Adresse de livraison
    (BT-78) • Code Pays Adresse de livraison (BT-80) Ces informations peuvent également être transmises à la ligne ( (si différent
    entête) - Bloc EXT-FR-FE-BG-10 ). Ces données ne sont pas à transmettre pour les prestations de service Règle de gestion
    métier mais ne peut pas être contrôlée d’un point de vue applicatif'
  bt:
  - BG-15
  - BG-8
  - BT-75
  - BT-77
  - BT-78
  - BT-80
  - BG-10
  source: DGFiP annexe 7 v1.9 (3.2)
G6.17:
  id: G6.17
  title: Taux de TVA des charges ou frais au niveau du document
  explanation: Si le bloc BG-21 (CHARGES OU FRAIS AU NIVEAU DU DOCUMENT) est renseigné et le code de type de TVA BT-102 est
    différent de « Non soumis à la TVA », alors le Taux de TVA de la remise au niveau du document (BT-103) est obligatoire.
  bt:
  - BG-21
  - BT-102
  - BT-103
  source: DGFiP annexe 7 v1.9 (3.2)
G6.20:
  id: G6.20
  title: Date de fin d'une période de facturation
  explanation: La date de fin d’une période de facturation ne peut pas être antérieure à la date de début de période.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.21:
  id: G6.21
  title: Exonération TVA - Avoir net de taxe
  explanation: Si, dans la facture, il y a un code de motif d'exonération de la TVA (BT-121 pour le flux 1, ou TT-59 pour
    le flux 10) égal à VATEX-FR-CNWVAT (avoir net de taxe), alors le type de document (BT-3 ou TT-21) doit être de type avoir
    (261 - Avoir auto-facturé, 381 – Avoir, 396 - Avoir affacturé).
  bt:
  - BT-121
  - BT-3
  source: DGFiP annexe 7 v1.9 (3.2)
G6.22:
  id: G6.22
  title: Type ID émetteur transmission
  explanation: Seules les transmissions émises par une plateforme agréée sont acceptées au sein du PPF. L'id émetteur (TT-8)
    attendu est la matricule de la plateforme agréée (4 caractères) et le type id émetteur (TT-7) est 0238.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.23:
  id: G6.23
  title: Devise TVA
  explanation: La valeur du montant de TVA doit être exprimée en euros (TT-52 / TT-83).
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.24:
  id: G6.24
  title: Date de début d'une période
  explanation: La date de début d'une période de transmission doit être antérieure ou égale à la date du contrôle dans le
    système..
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.25:
  id: G6.25
  title: Date de fin d'une période de transmission
  explanation: La date de fin d’une période de transmission ne peut pas être antérieure ou égale à la date de début de période.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.26:
  id: G6.26
  title: Id déclarant
  explanation: 'Pour le flux 10, à appliquer sur les balises TT-12 et TT-13 : - Le SIREN du déclarant (id déclarant) est une
    donnée obligatoire (9 caractères numériques), doit être connu de la base INSEE, - Le type id déclarant relatif au SIREN
    est obligatoire et ne peut prendre comme valeur que 0002, - Ces données sont obligatoires à partir du 01/09/2026. Pour
    le flux 6, au sein de la balise ID Emetteur document global (MDT-38) Facture B2B : - Le matricule d''une plateforme (plateforme
    agréée, CPRO, PPF) avec 4 caractères peut être renseigné avec le code 0238 au sein de la balise MDT-37 « Type ID Emetteur
    du document » Le numéro de SIREN avec9 caractères peut être renseigné avec le code 0002 au sein de la balise MDT-37 «
    Type ID Emetteur du document » Facture B2G : Le numéro de SIRET avec comme qualifiant dans la balise Type Id Emetteur
    Document (MDT-37), le code 0009 ou Si le fournisseur ne possède pas de SIRET, il faut renseigner un identifiant de structure
    avec comme qualifiant dans la balise Type Id Emetteur Document (MDT-37), l’une des valeurs suivantes : "0223" --> UE_HORS_FRANCE
    "0227" --> HORS_UE (dont Wallis et Futuna) "0228" --> RIDET "0229" --> TAHITI "0226" --> PARTICULIER'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.27:
  id: G6.27
  title: Devise montant encaissé
  explanation: La valeur du montant encaissé doit être exprimée en euros (TT-95 et TT-99).
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.28:
  id: G6.28
  title: Transmission de facture
  explanation: La transmission de facture en B2C n'est pas autorisée. Seule la transmission de facture en B2Bi est autorisée.
    De ce fait l'identifiant de l'acheteur (TT-36) est obligatoire.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.29:
  id: G6.29
  title: Flux de transmissions agrégées
  explanation: La transmission est soit une transmission de transactions agrégées (TB-1 et TB-2) soit une transmission de
    paiements agrégés (TB-1 et TB-3). Les deux transmissions agrégées sont à transmettre distinctement (sinon elles seront
    rejetées).
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.30:
  id: G6.30
  title: Données obligatoires - Trajectoire "CIBLE" - Adresse de livraison
  explanation: 'Certaines données liées à l''adresse de livraison TG-19 sont obligatoires si l’adresse est différente de l''adresse
    de facturation (Acheteur - Bloc TG-15) et seulement à partir du 01/09/2027. Les données obligatoires sont les suivantes
    : • Adresse de livraison - Ligne 1 (TT-103) • Localité Adresse de livraison (TT-106) • Code postal Adresse de livraison
    (TT-107) • Code de pays (TT-44) Ces informations peuvent également être transmises à la ligne (bloc TG-41). Ces données
    ne sont pas à transmettre pour les prestations de service Règle de gestion métier mais ne peut pas être contrôlée d’un
    point de vue applicatif'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.6:
  id: G6.06
  title: Gestion de la DEEE
  explanation: Note à la ligne permettant d'indiquer si la ligne concerne une DEEE Règle de gestion métier mais ne peut pas
    être contrôlée d’un point de vue applicatif.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.7:
  id: G6.07
  title: B2C
  explanation: Mention obligatoire de facture prévue par les textes (article 242 nonies A ann.II au CGI) qui n'est pas exigée
    dans le cadre du e-reporting B2C (art. 242 nonies M ann.II au CGI).
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.8:
  id: G6.08
  title: Données obligatoires - Trajectoire "DEMARRAGE"
  explanation: Cette donnée est systématiquement obligatoire à partir du 01/09/2026
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G6.9:
  id: G6.09
  title: Données obligatoires - Trajectoire "CIBLE"
  explanation: Cette donnée est systématiquement obligatoire à partir du 01/09/2027
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.1:
  id: G7.01
  title: Code rôle
  explanation: 'Liste des codes rôles acceptés par le PPF (les codes sont issus de la liste UNCL 3035) : BY : Acheteur (Buyer)
    ; DL : Affactureur (Factor) SE : Vendeur (Seller) AB : Agent d''acheteur (Buyer''s agent) SR : Agent de Vendeur (Seller''s
    agent) PE : Bénéficiaire (Payee) PR : Payeur (Payer) WK : Plateforme ou opérateur de dématérialisation (du fournisseur/vendeur
    ou de l''acheteur) ; DFH : Pour le PPF II : Facturer (Invoicer) IV : Facturé à (Invoicee)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.12:
  id: G7.12
  title: Code montant
  explanation: 'Le code montant (MDT-207) est à choisir dans la liste suivante : - RAP : Reste à payer (en cas de paiement
    partiel); - ESC : Escompte accordé ; - RAB : Rabais accordé ; - REM : Remise accordée. - MPA : Montant payé - MEN : Montant
    encaissé (TTC)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.14:
  id: G7.14
  title: Code
  explanation: 'En fonction du format du flux sur lequel porte le Cycle de Vie, le code urn suivant est à renseigner : 1.
    CDV sur un flux (e-invoicing, annuaire, CDV ou e-reporting) urn.cpro.gouv.fr:1p0:CDV:flux 2. CDV sur une facture (e-invoicing)
    : urn.cpro.gouv.fr:1p0:CDV:einvoicingF2 3. CDV sur des données réglementaires (e-invoicing) : urn.cpro.gouv.fr:1p0:CDV:einvoicingF1
    4. CDV sur une transmission (e-reporting) : urn.cpro.gouv.fr:1p0:CDV:ereportingF10 6. CDV sur des données annuaires :
    urn.cpro.gouv.fr:1p0:CDV:annuaire 7. CDV sur un statut (CDV de CDV) : urn.cpro.gouv.fr:1p0:CDV:messageCDV'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.15:
  id: G7.15
  title: Code type de l'objet
  explanation: 'Code type permettant d''identifier l''objet du CDV : 303 : CDV sur Flux - caractère recevable ou irrecevable
    du flux (e-invoicing, e-reporting, CDV ou annuaire) 304 : CDV sur Transmission ou facture e-reporting (flux 8, 9 et 10)
    ou sur un flux 1 305 : CDV sur message CDV (sur un statut) (flux 6) 306 : CDV sur flux de données annuaires (flux 13 et
    14) Pour un CDV sur facture e-invoicing (Flux 2), le code correspond à celui du type de la facture (voir G1.01)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.17:
  id: G7.17
  title: Identification de l'émetteur
  explanation: 'En cas de message CDV sur des factures, de message CDV sur des données réglementaires (F1) ou de message CDV
    sur des CDV de factures, l''identification de l''émetteur de la facture est obligatoire : Pour un CDV de Facture, la MDT-129
    doit être renseignée de manière obligatoire avec le SIREN (il ne faudra renseigner qu''un seul SIREN en MDT-129 avec le
    code 0002 en MDT-130 sinon le CDV sera rejeté) mais elle permet aussi de renseigner en complément d''autres identifiants
    (SIRET, ...) en utilisant plusieurs itérations de la balise. Pour un CDV de Données réglementaires ou un CDV de CDV de
    facture, la MDT-129 doit être renseignée par le numéro de SIREN du fournisseur En cas de message CDV sur un flux, l''ID
    du flux suffit (MDT-87)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.18:
  id: G7.18
  title: Motif d'irrecevabilité
  explanation: 'Liste des codes d''irrecevabilité d''un flux et leur libellé acceptés par le PPF : Codes irrecevabilité du
    flux suite à des contrôles réalisés flux : - IRR_TAILLE - Contrôle de taille du flux - IRR_UNICITE - Contrôle d''unicité
    du flux - IRR_VIDE - Contrôle de flux non vide - IRR_FORM - Contrôle de format du nom de l''enveloppe - IRR_TYPE - Contrôle
    de type et extension du flux - IRR_ANTIVIRUS - Contrôle anti-virus - IRR_CODE_INTER - Code interface inconnu (ici il s’agit
    d’un code interface qui respecte le format mais qui n’est pas connu du système) - IRR_EXTRAC - L''archive du flux déposé
    n''a pas pu être extraite - IRR_CODE_APP - Aucun raccordement n''existe pour le code application correspondant au flux
    déposé Irrecevabilité du flux suite à des contrôles sur les fichiers du flux : - IRR_VIDE_F - Contrôle de non vide sur
    les fichiers du flux - IRR_TYPE_F - Contrôle de type et extension des fichiers du flux - IRR_SYNTAX - Contrôle syntaxique
    des fichiers du flux - IRR_TAILLE_PJ - Contrôle de taille des PJ de chaque fichier du flux - IRR_NOM_PJ - Contrôle du
    nom des PJ de chaque fichier du flux (absence de caractères interdits) - IRR_VID_PJ - Contrôle de PJ non vide de chaque
    fichier du flux - IRR_EXT_DOC - Contrôle de l''extension des PJ de chaque fichier du flux - IRR_TAILLE_F - Contrôle de
    taille max des fichiers contenus dans le flux - IRR_NOM_F - Contrôle du nom de fichier contenus dans le flux'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.19:
  id: G7.19
  title: Motif de rejet fonctionnel
  explanation: 'Liste des codes de rejet fonctionnel et leur libellé émis par le PPF : Flux 1 : - REJ_SEMAN > Analyse du format
    sémantique - REJ_UNI > Contrôle d''unicité - REJ_COH > Contrôle cohérence de données (les balises et les référentiels)
    Flux 10 : - REJ_PER > Contrôle période - REJ_SEMAN > Analyse du format sémantique - REJ_UNI > Contrôle d''unicité - REJ_COH
    > Contrôle cohérence de données (les balises et les référentiels) Flux 6 : - REJ_INC > Incohérence des statuts du CDV
    - REJ_INEX > Statut inexistant - REJ_RG > Règle de gestion non respectée - REJ_HAB > Erreur d''habilitation / rôle - REJ_ENCAISSEMENT
    > les encaissements (MDT-215) doivent-être répartis dans le flux par taux de TVA Flux 13 : - REJ_RG > Règle de gestion
    non respectée - REJ_HAB > Erreur d''habilitation / rôle - REJ_VAL_INC > Valeur incorrecte - REJ_COH > Contrôle de cohérence
    des données'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.22:
  id: G7.22
  title: Nom de flux - flux illisible
  explanation: En cas de flux illisible, renseigner le nom du fichier flux dans cette balise.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.23:
  id: G7.23
  title: Identifiants objets métiers
  explanation: 'En fonction de l''objet sur lequel porte de message CDV, renseigner : - Flux > ID Flux - Facture/ Données
    réglementaires > ID Facture - Transmission e-reporting > ID Transmission - Flux de données annuaire > ID transmission
    annuaire - Flux CDV > ID message CDV initial (MDT-4)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.25:
  id: G7.25
  title: Commentaire motif refus / suspendu
  explanation: En cas de statut 210 (Refusée) ou 208 (Suspendue) pour un objet métier, il faut renseigner un commentaire motivant
    le refus / la suspension dans cette balise (MDT-126).
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.29:
  id: G7.29
  title: Libellé erreur
  explanation: 'En cas d''anomalie fonctionnelle relative à des F1 ou F10 ou F6 de facture : - Renseigner le code la règle
    de gestion qui a provoqué l''erreur en MDT-125 - Renseigner le nom des données invalides (fichiers ou balises) en MDT-127
    - Renseigner le message d’erreur en MDT-126 (le message d’erreur doit être relatif aux champs référencés en MDT-127) En
    cas d''anomalie fonctionnelle relative à des F13 : - Renseigner le numéro de l''itération de la ligne d''annuaire/code
    de routage au sein du fichier ayant posé problème en MDT-127 - Renseigner la balise invalide, le code de la règle de gestion
    qui a provoqué l''erreur et le message d’erreur (s''il y en a) en MDT-126 En cas d''anomalie applicative : - Renseigner
    le nom des fichiers invalides en MDT-127'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.30:
  id: G7.30
  title: Liste codes unités de mesure
  explanation: La liste des codes d'unité de mesure se trouve dans les Recommandations 20 et 21 de l'UNECE (voir l'onglet
    EN16931 Codelists)
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.31:
  id: G7.31
  title: Date d'édition de la facture obligatoire
  explanation: 'Le bloc MDG-35 (balises MDT-100 et MDT-100-1) doit être renseigné avec les données suivantes : - La date d''émission
    de la facture (BT-2) dans le cas d’un CDV d’une transmission de données réglementaires (F1) ou de facture (F2), - La date
    de transmission (TT-3) dans le cas d’un CDV d’une transmission de données e-Reporting (F10), - La date de création du
    message CDV (MDT-8), objet du nouveau CDV (dans le cas d’un CDV rejetant un 1er CDV)'
  bt:
  - BT-2
  source: DGFiP annexe 7 v1.9 (3.2)
G7.32:
  id: G7.32
  title: Données "Destinaire" obligatoires en CDV sur Objet métier
  explanation: Dans le cadre d'un CDV sur un objet métier, les balises MDT-56, MDT-57 et MDT-59 doivent être renseignées.
    Dans le cadre d'un CDV sur un flux, ces balises ne seront pas renseignées par le PPF
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.33:
  id: G7.33
  title: Nommage des flux
  explanation: 'Le flux doit être nommé selon la convention suivante : • un code interface qui permet d’identifier la nature
    du flux et son format (8 caractères, voir Dossier général des spécifications externes du PPF) ; • un code application
    partenaire de l’émetteur destinataire du flux (6 caractères) ; • un identifiant de flux (25 caractères) construit à partir
    du code application de l’émetteur du flux (6 premiers caractères) et d’un numéro de séquence (19 caractères : chiffres
    ou lettres majuscules).'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.34:
  id: G7.34
  title: Nommage d'une transmission e-reporting
  explanation: L'Id d'une transmission ne doit pas dépasser 50 caractères
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.39:
  id: G7.39
  title: Refus (cadre de facturation S6)
  explanation: Si la facture a un cadre de facturation égal à S6 (Dépôt par un cotraitant d’une facture de service), et que
    le statut apposé est « Refusée », seul les motifs de refus suivants sont possibles « DEST_ERR » (Erreur de destinataire),
    « ROUTAGE_ERR » (Erreur de routage) et CODE_ROUTAGE_ERR (code routage du destinataire est erroné ou absent).
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.40:
  id: G7.40
  title: Horodatage de création d'une transmission
  explanation: L'horodatage de création de la transmission (TT-3) est généré au moment de la création du flux par la PA qui
    doit émettre le flux de e-reporting vers le PPF.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.43:
  id: G7.43
  title: Période de transmission
  explanation: La date de fin de période de transmission (TT-18 ou TT-90) doit être antérieure à la date de contrôle dans
    le système. La date de création de la transmission (TT-3) doit être antérieure à la date de contrôle dans le système et
    postérieure à la date de fin de période déclarée (TT-18 ou TT-90).
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.44:
  id: G7.44
  title: Cohérence des statuts obligatoire du flux 1
  explanation: 'Dans le cadre de la transmission des statuts de factures au PPF, le cycle de vie est rejeté (Motif de rejet
    : REJ_RG) s''il référence un statut non obligatoire. La liste des statuts obligatoires sont les suivants: - 200 - Déposée
    - 210 - Refusée - 212 - Encaissée - 213 - Rejetée'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.45:
  id: G7.45
  title: Cycle de vie -Gestion de l'encaissement
  explanation: 'Dans le cas d’un encaissement (MDT-105 = 212), le montant encaissé (MDT-215) doit être réparti dans le flux
    par taux de TVA (MDT-224) sinon le cycle de vie est rejeté par le PPF (Motif de rejet : REJ_ENCAISSEMENT)'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.46:
  id: G7.46
  title: Raison sociale plateforme agréée/PPF facultative
  explanation: La raison sociale d'une entité est obligatoire sauf dans le cas d'une plateforme agréée (dont le code rôle
    est WK) ou du PPF (dont le code rôle est DFH)
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.47:
  id: G7.47
  title: Code rôle Emetteur flux CDV
  explanation: 'Liste des codes rôles acceptés par le PPF en MDT-21 (les codes sont issus de la liste UNCL 3035) : WK : Plateforme
    agréée ou solution compatible (du fournisseur/vendeur ou de l''acheteur) ; DFH : Pour le PPF'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.49:
  id: G7.49
  title: Rejet d'un CDV avec une PJ
  explanation: Le PPF rejettera tout CDV contenant une PJ (le PPF est plus restrictif que le XSD de la norme CDAR qui laisse
    cette possibilité)
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.51:
  id: G7.51
  title: Code rôle
  explanation: Seules les transmissions émises par une plateforme agréée sont acceptées au sein du PPF. Le code rôle attendu
    est donc WK.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.52:
  id: G7.52
  title: Code rôle
  explanation: 'Liste des codes rôles acceptés par le PPF (les codes sont issus de la liste UNCL 3035) : BY : Acheteur ;SE
    : Vendeur'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.53:
  id: G7.53
  title: Date-heure
  explanation: Les champs date-heure doivent être au format AAAAMMJJHHMMSS.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.54:
  id: G7.54
  title: Identifiant de l'émetteur du flux
  explanation: L'identifiant de l'émetteur du flux de CDV (MDT-19) doit être obligatoirement un matricule défini par le qualifiant
    (MDT-18) '0238' et constitué de 4 chiffres
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.6:
  id: G7.06
  title: Date-heure
  explanation: Les champs date-heure doivent être au format AAAAMMJJHHMMSS. Pour cela il faut renseigner la valeur de l'attribut
    @format = 204
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.7:
  id: G7.07
  title: Format d’un Montant
  explanation: Le montant dans une facture est exprimé par un nombre sur 19 positions, et ne peut comporter plus de 6 décimales.
    Le séparateur entre le nombre entier et les décimales est un point (« . »). Le signe négatif (« - ») devant le montant
    compte comme un caractère. Si le nombre total de chiffres du nombre (partie entière et partie décimale comprises) dépasse
    19 caractères, le montant sera rejeté. Le séparateur (".") n'est pas comptabilisé dans les 19 caractères.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.8:
  id: G7.08
  title: Statuts
  explanation: 'Le champ MDT-113 (code motif rejet) doit être rempli dans le cas où : un flux est irrecevable (code : 501),
    un objet métier est rejeté (code : 213, 251, 301, 401, 601) ou une facture est refusée (code : 210).'
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G7.9:
  id: G7.09
  title: Liste des codes et des libellés des statuts
  explanation: cf. onglet "Statuts" de l'annexe 2 (Format sémantique FE CDV - Flux 6)
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G8.1:
  id: G8.01
  title: Type transmission
  explanation: Les seules valeurs acceptées pour le type de transmission (TT-4) sont IN et RE.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
G8.5:
  id: G8.05
  title: Id transmission
  explanation: Un identifiant de transmission (TT-1) est unique par période (TT-17 / TT-18 ou TT-89 / TT-90) et par déclarant
    (TT-13). Un contrôle de doublon est effectué sur cette balise, par période et par déclarant. Ce contrôle est bloquant
    et est un motif de rejet de la déclaration.
  bt: []
  source: DGFiP annexe 7 v1.9 (3.2)
