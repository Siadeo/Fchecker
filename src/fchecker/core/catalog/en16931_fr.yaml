# Traduction française des règles EN 16931, réalisée pour Fchecker.
# Traduite uniquement à partir des messages anglais des artefacts de validation CEN/TC 434
# (https://github.com/ConnectingEurope/eInvoicing-EN16931, version indiquée dans core/referentiels.py).
# Œuvre dérivée de ces artefacts : ce fichier est distribué sous licence EUPL-1.2
# (https://interoperable-europe.ec.europa.eu/collection/eupl/eupl-text-eupl-12).
#
# Règles de rédaction : ne JAMAIS reprendre la traduction française de la norme (protégée) ni
# les libellés de l'annexe 7 des spécifications DGFiP qui en dérivent ; traduire depuis l'anglais en
# employant le glossaire ci-dessous. en_sha = 12 premiers caractères du SHA-256 du message anglais traduit
# (tools/check_translations.py signale les règles dont l'anglais a changé).
