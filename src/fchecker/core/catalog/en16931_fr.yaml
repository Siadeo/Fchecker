  BR-AG-03:
    title: Si une remise sur le document (BG-20) relève de la catégorie « IPSI (Ceuta et Melilla) » (AG) (BT-95), la facture
      doit indiquer le numéro de TVA du vendeur (BT-31), son identifiant fiscal (BT-32) ou le numéro de TVA de son représentant
      fiscal (BT-63).
    en_sha: 3e36f82056a9
  BR-AG-04:
    title: Si des frais sur le document (BG-21) relève de la catégorie « IPSI (Ceuta et Melilla) » (AG) (BT-102), la facture
      doit indiquer le numéro de TVA du vendeur (BT-31), son identifiant fiscal (BT-32) ou le numéro de TVA de son représentant
      fiscal (BT-63).
    en_sha: afaaca1075b4
  BR-AG-05:
    title: Pour une ligne (BG-25) de catégorie « IPSI (Ceuta et Melilla) » (AG) (BT-151), le taux de TVA (BT-152) doit être
      nul ou positif.
