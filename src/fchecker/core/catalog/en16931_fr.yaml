rules:
  BR-01:
    title: La facture doit indiquer un identifiant de spécification (BT-24).
    en_sha: a4aa3939c207
  BR-02:
    title: La facture doit porter un numéro (BT-1).
    en_sha: 2a415bf67996
  BR-03:
    title: La facture doit porter une date d'émission (BT-2).
    en_sha: f7250b5508be
  BR-04:
    title: La facture doit indiquer le code de son type (BT-3).
    en_sha: 2d7f8077a8e9
  BR-05:
    title: La facture doit indiquer sa devise (BT-5).
    en_sha: 3ebafe9d3405
  BR-06:
    title: La facture doit indiquer le nom du vendeur (BT-27).
    en_sha: aff192f05362
  BR-07:
    title: La facture doit indiquer le nom de l'acheteur (BT-44).
    en_sha: 019e097d8f3e
  BR-08:
    title: L'adresse postale du vendeur (BG-5) est obligatoire.
    en_sha: d0af8c375c45
  BR-09:
    title: L'adresse postale du vendeur (BG-5) doit comporter un code pays (BT-40).
    en_sha: 69c92ce36a40
  BR-10:
    title: L'adresse postale de l'acheteur (BG-8) est obligatoire.
    en_sha: 3839a803ec7b
  BR-11:
    title: L'adresse postale de l'acheteur doit comporter un code pays (BT-55).
    en_sha: 405f7166b789
  BR-12:
    title: La facture doit indiquer le total des montants nets de ligne (BT-106).
    en_sha: 403f93d0db96
  BR-13:
    title: La facture doit indiquer son total HT (BT-109).
    en_sha: 8b6f4c972f9f
  BR-14:
    title: La facture doit indiquer son total TTC (BT-112).
    en_sha: c0f8939923c7
  BR-15:
    title: La facture doit indiquer le net à payer (BT-115).
    en_sha: 7f7a49784599
  BR-16:
    title: La facture doit comporter au moins une ligne (BG-25).
    en_sha: e3a9b27f7061
  BR-17:
    title: Lorsque le bénéficiaire du paiement (BG-10) n'est pas le vendeur (BG-4), son nom (BT-59) doit figurer sur la facture.
    en_sha: 20e03f95947e
  BR-18:
    title: Lorsque le vendeur (BG-4) passe par un représentant fiscal (BG-11), le nom de ce représentant (BT-62) doit figurer
      sur la facture.
    en_sha: 7ff9c4874106
  BR-19:
    title: Lorsque le vendeur (BG-4) passe par un représentant fiscal (BG-11), l'adresse postale de ce représentant (BG-12)
      doit figurer sur la facture.
    en_sha: 120bf35ff0e1
  BR-20:
    title: Lorsque le vendeur (BG-4) passe par un représentant fiscal (BG-11), l'adresse postale de ce représentant (BG-12)
      doit comporter un code pays (BT-69).
    en_sha: 4249afb909e9
  BR-21:
    title: Chaque ligne (BG-25) doit avoir un identifiant (BT-126).
    en_sha: aacd08aa415c
  BR-22:
    title: Chaque ligne (BG-25) doit indiquer une quantité facturée (BT-129).
    en_sha: 00e5eab7a78c
  BR-23:
    title: Chaque ligne (BG-25) doit indiquer l'unité de la quantité facturée (BT-130).
    en_sha: 7d076bcc8cac
  BR-24:
    title: Chaque ligne (BG-25) doit indiquer son montant net (BT-131).
    en_sha: 0d3a5f80eb0c
  BR-25:
    title: Chaque ligne (BG-25) doit indiquer le nom de l'article (BT-153).
    en_sha: 6a5bd6400c1a
  BR-26:
    title: Chaque ligne (BG-25) doit indiquer le prix net unitaire de l'article (BT-146).
    en_sha: 98234b764344
  BR-27:
    title: Le prix net unitaire de l'article (BT-146) ne peut pas être négatif.
    en_sha: d2bf12b20ada
  BR-28:
    title: Le prix brut unitaire de l'article (BT-148) ne peut pas être négatif.
    en_sha: 53f29baae5b5
  BR-29:
    title: Lorsque la période de facturation a un début (BT-73) et une fin (BT-74), la fin ne peut pas précéder le début.
    en_sha: a66d55b25778
  BR-30:
    title: Lorsque la période d'une ligne a un début (BT-134) et une fin (BT-135), la fin ne peut pas précéder le début.
    en_sha: e82151daf898
  BR-31:
    title: Chaque remise sur le document (BG-20) doit indiquer son montant (BT-92).
    en_sha: 6bf6c5219fe3
  BR-32:
    title: Chaque remise sur le document (BG-20) doit indiquer sa catégorie de TVA (BT-95).
    en_sha: 8f4334d89f02
  BR-33:
    title: Chaque remise sur le document (BG-20) doit indiquer un motif, en clair (BT-97) ou codé (BT-98).
    en_sha: 033cd9a98cbe
  BR-36:
    title: Chaque frais sur le document (BG-21) doit indiquer son montant (BT-99).
    en_sha: 67bb126a582e
  BR-37:
    title: Chaque frais sur le document (BG-21) doit indiquer sa catégorie de TVA (BT-102).
    en_sha: b7f0091f3dc5
  BR-38:
    title: Chaque frais sur le document (BG-21) doit indiquer un motif, en clair (BT-104) ou codé (BT-105).
    en_sha: 6bf854052974
  BR-41:
    title: Chaque remise sur une ligne (BG-27) doit indiquer son montant (BT-136).
    en_sha: f7233dd21a13
  BR-42:
    title: Chaque remise sur une ligne (BG-27) doit indiquer un motif, en clair (BT-139) ou codé (BT-140).
    en_sha: c6d70163e973
  BR-43:
    title: Chaque frais sur une ligne (BG-28) doit indiquer son montant (BT-141).
    en_sha: 264cdc8dd533
  BR-44:
    title: Chaque frais sur une ligne (BG-28) doit indiquer un motif, en clair (BT-144) ou codé (BT-145).
    en_sha: dd3899e632a1
  BR-45:
    title: Chaque groupe du récapitulatif de TVA (BG-23) doit indiquer sa base HT (BT-116).
    en_sha: 270cbe16cb8e
  BR-46:
    title: Chaque groupe du récapitulatif de TVA (BG-23) doit indiquer son montant de TVA (BT-117).
    en_sha: 5ec6c00107ab
  BR-47:
    title: Chaque groupe du récapitulatif de TVA (BG-23) doit être identifié par un code de catégorie (BT-118).
    en_sha: d9b58b92458b
  BR-48:
    title: Chaque groupe du récapitulatif de TVA (BG-23) doit indiquer son taux (BT-119), sauf pour une facture hors du champ
      de la TVA.
    en_sha: 564a27052d11
  BR-49:
    title: Les instructions de paiement (BG-16) doivent préciser le code du moyen de paiement (BT-81).
    en_sha: a3a63e8071f9
  BR-50:
    title: Lorsque la facture prévoit un paiement par virement (BG-16), l'identifiant du compte à créditer (BT-84) doit être
      indiqué.
    en_sha: 2cd8c6bd5c0e
  BR-51:
    title: 'Pour respecter les normes de sécurité des paiements par carte, la facture ne doit jamais comporter le numéro complet
      de la carte (BT-97) : au plus les 6 premiers et les 4 derniers chiffres, selon le PCI Security Standards Council.'
    en_sha: f7de53bf1ee3
  BR-52:
    title: Chaque pièce justificative jointe (BG-24) doit avoir une référence (BT-122).
    en_sha: f7a855a4ef09
  BR-53:
    title: Si la TVA est aussi exprimée dans une devise de déclaration (BT-6), le total de TVA dans cette devise (BT-111)
      est obligatoire.
    en_sha: 1f79e71e0c46
  BR-54:
    title: Chaque attribut d'article (BG-32) doit avoir un nom (BT-160) et une valeur (BT-161).
    en_sha: 23b447cc7ba3
  BR-55:
    title: Toute référence à une facture antérieure (BG-3) doit donner le numéro de cette facture (BT-25).
    en_sha: 4a5995fb6f65
  BR-56:
    title: Le représentant fiscal du vendeur (BG-11) doit indiquer son numéro de TVA (BT-63).
    en_sha: 6489dc6ad2b1
  BR-57:
    title: L'adresse de livraison (BG-15) doit comporter un code pays (BT-80).
    en_sha: d59a60949a5b
  BR-61:
    title: Pour un paiement par virement (SEPA, national ou international hors SEPA) selon le code du moyen de paiement (BT-81),
      l'identifiant du compte à créditer (BT-84) est obligatoire.
    en_sha: 05f6bbc7886e
  BR-62:
    title: L'adresse électronique du vendeur (BT-34) doit préciser son schéma d'identification.
    en_sha: 164a942805ca
  BR-63:
    title: L'adresse électronique de l'acheteur (BT-49) doit préciser son schéma d'identification.
    en_sha: e194990e9d7a
  BR-64:
    title: L'identifiant normalisé de l'article (BT-157) doit préciser son schéma d'identification.
    en_sha: 5a2ebe3ad355
  BR-65:
    title: Le code de classification de l'article (BT-158) doit préciser son schéma d'identification.
    en_sha: 78c67b5992f0
  BR-AE-01:
    title: Si une ligne, une remise ou des frais sur le document relèvent de la catégorie de TVA « autoliquidation » (AE)
      (BT-151, BT-95 ou BT-102), le récapitulatif de TVA (BG-23) doit comporter exactement un groupe de cette catégorie (BT-118).
    en_sha: 7db719da4514
  BR-AE-02:
    title: Si une ligne (BG-25) relève de la catégorie « autoliquidation » (AE) (BT-151), la facture doit indiquer le numéro
      de TVA du vendeur (BT-31), son identifiant fiscal (BT-32) ou le numéro de TVA de son représentant fiscal (BT-63), ainsi
      que le numéro de TVA (BT-48) ou l'identifiant légal (BT-47) de l'acheteur.
    en_sha: d9aa75843b1b
  BR-AE-03:
    title: Si une remise sur le document (BG-20) relève de la catégorie « autoliquidation » (AE) (BT-95), la facture doit
      indiquer le numéro de TVA du vendeur (BT-31), son identifiant fiscal (BT-32) ou le numéro de TVA de son représentant
      fiscal (BT-63), ainsi que le numéro de TVA (BT-48) ou l'identifiant légal (BT-47) de l'acheteur.
    en_sha: 72f86a38d574
  BR-AE-04:
    title: Si des frais sur le document (BG-21) relève de la catégorie « autoliquidation » (AE) (BT-102), la facture doit
      indiquer le numéro de TVA du vendeur (BT-31), son identifiant fiscal (BT-32) ou le numéro de TVA de son représentant
      fiscal (BT-63), ainsi que le numéro de TVA (BT-48) ou l'identifiant légal (BT-47) de l'acheteur.
    en_sha: 953c12792a13
  BR-AE-05:
    title: Pour une ligne (BG-25) de catégorie « autoliquidation » (AE) (BT-151), le taux de TVA (BT-152) doit être nul (0).
    en_sha: 8e4bed6f9373
  BR-AE-06:
    title: Pour une remise sur le document (BG-20) de catégorie « autoliquidation » (AE) (BT-95), le taux de TVA (BT-96) doit
      être nul (0).
    en_sha: 54b4fe066a9f
  BR-AE-07:
    title: Pour des frais sur le document (BG-21) de catégorie « autoliquidation » (AE) (BT-102), le taux de TVA (BT-103)
      doit être nul (0).
    en_sha: 60312fd7edaf
  BR-AE-08:
    title: 'Dans le groupe de catégorie « autoliquidation » (AE) du récapitulatif de TVA (BG-23), la base HT (BT-116) doit
      valoir : montants nets des lignes (BT-131), moins remises (BT-92) et plus frais (BT-99) sur le document, en ne retenant
      que cette catégorie (BT-151, BT-95, BT-102).'
    en_sha: 36756a67f71b
  BR-AE-09:
    title: Dans le groupe de catégorie « autoliquidation » (AE) du récapitulatif de TVA (BG-23), le montant de TVA (BT-117)
      doit être nul (0).
    en_sha: 50e91d24c21f
  BR-AE-10:
    title: Le groupe de catégorie « autoliquidation » (AE) du récapitulatif de TVA (BG-23) doit indiquer le motif d'exonération
      correspondant, codé (BT-121) ou en clair (BT-120) « autoliquidation » (ou son équivalent dans une autre langue).
    en_sha: a68adf2110c0
  BR-AF-01:
    title: Si une ligne, une remise ou des frais sur le document relèvent de la catégorie de TVA « IGIC (Canaries) » (AF)
      (BT-151, BT-95 ou BT-102), le récapitulatif de TVA (BG-23) doit comporter au moins un groupe de cette catégorie (BT-118).
    en_sha: 88fae56a0cbb
  BR-AF-02:
    title: Si une ligne (BG-25) relève de la catégorie « IGIC (Canaries) » (AF) (BT-151), la facture doit indiquer le numéro
      de TVA du vendeur (BT-31), son identifiant fiscal (BT-32) ou le numéro de TVA de son représentant fiscal (BT-63).
    en_sha: f89731ac4917
  BR-AF-03:
    title: Si une remise sur le document (BG-20) relève de la catégorie « IGIC (Canaries) » (AF) (BT-95), la facture doit
      indiquer le numéro de TVA du vendeur (BT-31), son identifiant fiscal (BT-32) ou le numéro de TVA de son représentant
      fiscal (BT-63).
    en_sha: f1a0a2643c54
  BR-AF-04:
    title: Si des frais sur le document (BG-21) relève de la catégorie « IGIC (Canaries) » (AF) (BT-102), la facture doit
      indiquer le numéro de TVA du vendeur (BT-31), son identifiant fiscal (BT-32) ou le numéro de TVA de son représentant
      fiscal (BT-63).
    en_sha: 1692d1fedfa0
  BR-AF-05:
    title: Pour une ligne (BG-25) de catégorie « IGIC (Canaries) » (AF) (BT-151), le taux de TVA (BT-152) doit être strictement
      positif.
    en_sha: 6554d039b7ae
  BR-AF-06:
    title: Pour une remise sur le document (BG-20) de catégorie « IGIC (Canaries) » (AF) (BT-95), le taux de TVA (BT-96) doit
      être nul ou positif.
    en_sha: b47cd797cfc2
  BR-AF-07:
    title: Pour des frais sur le document (BG-21) de catégorie « IGIC (Canaries) » (AF) (BT-102), le taux de TVA (BT-103)
      doit être nul ou positif.
    en_sha: 909933f1d41b
  BR-AF-08:
    title: 'Pour chaque taux (BT-119) de la catégorie « IGIC (Canaries) » (AF), la base HT (BT-116) du groupe correspondant
      du récapitulatif de TVA (BG-23) doit valoir : montants nets des lignes (BT-131), plus frais (BT-99) et moins remises
      (BT-92) sur le document, en ne retenant que cette catégorie (BT-151, BT-102, BT-95) et ce taux (BT-152, BT-103, BT-96).'
    en_sha: ab0e325858d3
  BR-AF-09:
    title: Dans le groupe de catégorie « IGIC (Canaries) » (AF) du récapitulatif de TVA (BG-23), le montant de TVA (BT-117)
      doit être égal à la base HT (BT-116) multipliée par le taux (BT-119).
    en_sha: da0699782ba7
  BR-AF-10:
    title: Le groupe de catégorie « IGIC (Canaries) » (AF) du récapitulatif de TVA (BG-23) ne doit comporter aucun motif d'exonération,
      ni codé (BT-121) ni en clair (BT-120).
    en_sha: 2986d31b0229
  BR-AG-01:
